

{% extends "books/base.html" %}

{% block title %}
Confirm Book Delete
{% endblock %}

{% block content %}
    <p> Are you sure you want to delete this book? </p>
    <p>{{ book }}</p>

    <div class="choices">
        <form method="post">
            {% csrf_token %}
            <button class="delete-choice" type="submit">Yes</button>
        </form>

        <button class="delete-choice" onclick=" window.location= '/' ">No</button>
    </div>

{% endblock %}
